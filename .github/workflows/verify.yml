name: Verify

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Check and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type and Astro check
        run: npm run check

      - name: Verify content model
        run: npm run verify:content

      - name: Build site
        run: npm run build

      - name: Verify build output
        run: npm run verify:dist

      - name: Verify internal links
        run: npm run verify:links
